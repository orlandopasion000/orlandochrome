<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OrlandoChrome · Taskbar Notes</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/svg+xml" href="oc-logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="netflix-messenger-theme">
  <!-- Top Application Bar -->
  <header class="app-topbar">
    <div class="topbar-left">
      <div class="brand-logo" id="logoBtn" title="OrlandoChrome Taskbar Notes">
        <img src="oc-logo.svg" class="oc-logo-img" alt="OC Logo">
        <div class="brand-text-wrap">
          <span class="brand-title"><span class="title-orlando">ORLANDO</span><span class="title-chrome">CHROME</span></span>
          <span class="brand-sub">TASKBAR NOTES</span>
        </div>
      </div>
    </div>

    <div class="topbar-right">
      <!-- Live Clock & Daily Recharge Alarm Widget -->
      <div class="nav-clock-box" id="navClockBox">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </header>

  <!-- Main 2-Pane Messenger Workspace -->
  <div class="app-workspace">
    <!-- Left Column: Search, Filters, and Chrome Profiles -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="search-box-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" id="profileSearch" class="search-input" placeholder="Search profiles or notes...">
        </div>

        <div class="filter-tabs-row">
          <button class="filter-tab active" data-filter="all" id="tabAll">All (<span id="countAll">21</span>)</button>
          <button class="filter-tab" data-filter="pending" id="tabPending">🔴 Pending (<span id="countPending">0</span>)</button>
          <button class="filter-tab" data-filter="timers" id="tabTimers">⏳ Timers (<span id="countTimers">0</span>)</button>
        </div>
      </div>

      <!-- Profiles List -->
      <div class="profile-list" id="profileList">
        <!-- Rendered dynamically -->
      </div>
    </aside>

    <!-- Right Column: Active Chrome Profile Notes & Timers -->
    <main class="chat-main" id="chatMain">
      <!-- Rendered dynamically -->
    </main>
  </div>

  <!-- Hidden Photo Upload Input -->
  <input type="file" id="globalPhotoInput" accept="image/*" style="display:none;">

  <!-- Toast Notification Container -->
  <div id="toast"></div>

  <!-- Scripts -->
  <script src="sound.js"></script>
  <script src="app.js"></script>
</body>
</html>
