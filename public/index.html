<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chrome Taskbar Notes · Messenger Style</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%230084ff'/><text x='50' y='65' font-size='42' text-anchor='middle' fill='%23ffffff' font-weight='bold'>💬</text></svg>">
</head>
<body>
  <div class="app-container">
    <!-- Top Compact Header Bar with Live Clock & Schedule -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-icon">💬</span>
        <div class="brand-text">
          <h1>Chrome Taskbar Notes</h1>
          <p>Messenger for your 21 taskbar Chrome profiles</p>
        </div>
      </div>
      <div class="header-right" id="headerClockWidget">
        <!-- Live Clock & Daily Recharge Alarm Next Event rendered dynamically -->
      </div>
    </header>

    <!-- Messenger Main 2-Pane Layout -->
    <div class="messenger-layout">
      <!-- Left Column: Chrome Profiles List (Like Messenger Inbox) -->
      <aside class="sidebar">
        <!-- Search & Filter Controls -->
        <div class="sidebar-top">
          <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search profiles or notes...">
          <div class="sidebar-filters">
            <button class="filter-tab active" data-filter="all" id="filterAll">All (21)</button>
            <button class="filter-tab" data-filter="pending" id="filterPending">🔴 Pending (<span id="pendingCountLabel">0</span>)</button>
            <button class="filter-tab" data-filter="timers" id="filterTimers">⏳ Timers (<span id="timersCountLabel">0</span>)</button>
          </div>
        </div>

        <!-- Scrollable Chrome Contact List -->
        <div class="chrome-list" id="chromeList">
          <!-- Rendered dynamically -->
        </div>
      </aside>

      <!-- Right Column: Notes & Messages Thread for Selected Chrome -->
      <main class="chat-pane" id="chatPane">
        <!-- Rendered dynamically -->
      </main>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast"></div>

  <!-- Scripts -->
  <script src="sound.js"></script>
  <script src="app.js"></script>
</body>
</html>
