<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chrome Synapse · 4K Native Engine Exporter</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #status {
      position: fixed;
      top: 10px;
      left: 10px;
      padding: 10px 18px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #38bdf8;
      border-radius: 8px;
      font-size: 14px;
      z-index: 10000;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div id="status">Initializing 4K Native Game Exporter...</div>
  <canvas id="canvas4k" width="3840" height="2160"></canvas>

  <!-- Load Real Game Engine Scripts -->
  <script src="game.js?v=arcade363_4k"></script>

  <script>
    (async function() {
      const statusEl = document.getElementById('status');
      const canvas = document.getElementById('canvas4k');
      const ctx = canvas.getContext('2d');

      function updateStatus(msg) {
        statusEl.textContent = msg;
        console.log('[4K Export]', msg);
      }

      // 1. Wait for all LayeredT4Assets to be 100% loaded
      updateStatus('Waiting for in-game 4K asset layers to be ready...');
      await new Promise((resolve) => {
        let attempts = 0;
        const checkAssets = () => {
          attempts++;
          const a = window.LayeredT4Assets;
          if (a) {
            const allComplete = a.halo?.dynamo?.complete && a.wingRight?.dynamo?.complete && a.coreBase?.dynamo?.complete;
            if (attempts > 25 || allComplete) {
              ['dynamo', 'helix', 'meteor'].forEach(m => {
                a.loaded.halo[m] = true;
                a.loaded.wingRight[m] = true;
                a.loaded.coreBase[m] = true;
                a.loaded.nodeShell[m] = true;
              });
              a.loaded.hazard.dynamoCore = true;
              a.loaded.hazard.dynamoGlitch = true;
              a.loaded.hazard.helixClean = true;
              a.loaded.hazard.meteorBlades = true;
              a.loaded.hazard.meteorCenter = true;
              resolve();
              return;
            }
          }
          setTimeout(checkAssets, 60);
        };
        checkAssets();
      });

      updateStatus('All in-game assets loaded! Preparing rendering routines...');

      // Deep space starry cosmic background - Pure, natural, zero fake HUD lines or brackets
      function drawCosmicBackground(theme = 'dynamo') {
        ctx.save();
        ctx.fillStyle = '#030308';
        ctx.fillRect(0, 0, 3840, 2160);

        // Subtle themed atmospheric nebula bloom in the center
        const cx = 1920, cy = 1080;
        const nebGrad = ctx.createRadialGradient(cx, cy, 200, cx, cy, 1800);
        if (theme === 'dynamo') {
          nebGrad.addColorStop(0.0, 'rgba(147, 51, 234, 0.16)');
          nebGrad.addColorStop(0.35, 'rgba(88, 28, 135, 0.10)');
          nebGrad.addColorStop(0.70, 'rgba(6, 182, 212, 0.05)');
        } else if (theme === 'helix') {
          nebGrad.addColorStop(0.0, 'rgba(6, 182, 212, 0.16)');
          nebGrad.addColorStop(0.35, 'rgba(192, 132, 252, 0.10)');
          nebGrad.addColorStop(0.70, 'rgba(56, 189, 248, 0.05)');
        } else if (theme === 'meteor') {
          nebGrad.addColorStop(0.0, 'rgba(234, 88, 12, 0.18)');
          nebGrad.addColorStop(0.35, 'rgba(220, 38, 38, 0.10)');
          nebGrad.addColorStop(0.70, 'rgba(245, 158, 11, 0.05)');
        } else {
          nebGrad.addColorStop(0.0, 'rgba(147, 51, 234, 0.12)');
          nebGrad.addColorStop(0.40, 'rgba(56, 189, 248, 0.08)');
          nebGrad.addColorStop(0.75, 'rgba(234, 88, 12, 0.06)');
        }
        nebGrad.addColorStop(1.0, 'rgba(3, 3, 8, 0)');
        ctx.fillStyle = nebGrad;
        ctx.fillRect(0, 0, 3840, 2160);

        // Precise mathematical procedural stars
        const starCount = 420;
        let seed = 1337;
        function rnd() {
          seed = (seed * 9301 + 49297) % 233280;
          return seed / 233280;
        }

        ctx.fillStyle = '#ffffff';
        for (let i = 0; i < starCount; i++) {
          const sx = rnd() * 3840;
          const sy = rnd() * 2160;
          const sz = rnd() * 2.2 + 0.6;
          const op = rnd() * 0.75 + 0.25;

          ctx.globalAlpha = op;
          ctx.beginPath();
          ctx.arc(sx, sy, sz, 0, Math.PI * 2);
          ctx.fill();

          // 4-point diffraction spike on brighter stars
          if (sz > 2.0) {
            ctx.strokeStyle = `rgba(255, 255, 255, ${op * 0.7})`;
            ctx.lineWidth = 1.0;
            ctx.beginPath();
            ctx.moveTo(sx - 8, sy); ctx.lineTo(sx + 8, sy);
            ctx.moveTo(sx, sy - 8); ctx.lineTo(sx, sy + 8);
            ctx.stroke();
          }
        }
        ctx.restore();
      }

      // Save helper to Python server
      async function saveFrame(filename) {
        updateStatus(`Encoding & uploading ${filename}...`);
        const dataUrl = canvas.toDataURL('image/png');
        const res = await fetch('/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename, data: dataUrl })
        });
        const json = await res.json();
        console.log(`Saved ${filename}:`, json);
      }

      const now = 24500.0; // stable, beautiful kinematic phase

      // ─────────────────────────────────────────────────────────────
      // TASK A: 12 INDIVIDUAL TIER CORES (TIER I -> TIER IV)
      // ZERO FAKE TEXT OVERLAYS, ZERO HUD BRACKETS, PURE 4K GAME ART
      // ─────────────────────────────────────────────────────────────
      const modes = [
        {
          id: 'dynamo',
          name: 'Chrome Dynamo',
          titleName: 'Dynamo',
          theme: 'dynamo',
          color: '#c084fc',
          render: (cx, cy, tier, u) => window.QuantumRenderer.drawDynamoCore(ctx, cx, cy, now, 0, tier, u)
        },
        {
          id: 'helix',
          name: 'Chrome Helix',
          titleName: 'Helix',
          theme: 'helix',
          color: '#38bdf8',
          render: (cx, cy, tier, u) => window.QuantumRenderer.drawHelixCore(ctx, cx, cy, now, 0, tier, u)
        },
        {
          id: 'meteor',
          name: 'Chrome Meteor',
          titleName: 'Meteor',
          theme: 'meteor',
          color: '#f97316',
          render: (cx, cy, tier, u) => window.QuantumRenderer.drawMeteorAsteroid(ctx, cx, cy, now, 0, tier, u)
        }
      ];

      for (const m of modes) {
        for (let tier = 1; tier <= 4; tier++) {
          updateStatus(`Rendering ${m.name} Tier ${tier} in Native 4K...`);
          drawCosmicBackground(m.theme);

          // Configure Kinematics specifically for this tier
          window.CoreKinematics.continuousTier = tier * 1.0;
          window.CoreKinematics.bodyBank = 0.0;
          window.CoreKinematics.vx = 0.0;
          window.CoreKinematics.lockOnProximity = 0.0;
          window.CoreKinematics.overdriveFlash = (tier === 4) ? 0.35 : 0.0;
          window.CoreKinematics.ascensionRings = (tier === 4) ? [
            { radius: 140, alpha: 0.85, mode: m.id, tierReached: 4 },
            { radius: 210, alpha: 0.55, mode: m.id, tierReached: 4 }
          ] : [];

          // Perfect geometric sizing centered in 4K (3840 x 2160)
          // Mathematical center: cx = 1920, cy = 1080
          let u = 1.85;
          let cy = 1080;
          if (tier === 1) { u = 3.2; cy = 1080; }
          else if (tier === 2) { u = 2.5; cy = 1080; }
          else if (tier === 3) { u = 2.1; cy = 1080; }
          else if (tier === 4) { u = 1.85; cy = 1080; }

          m.render(1920, cy, tier, u);

          const filename = `Chrome_${m.titleName}_Tier${tier}_4K.png`;
          await saveFrame(filename);

          // For Tier 4, also save as the primary Core file name
          if (tier === 4) {
            await saveFrame(`Chrome_${m.titleName}_Core_4K.png`);
          }
        }
      }

      // ─────────────────────────────────────────────────────────────
      // TASK B: 3 HORIZONTAL EVOLUTION LINEUPS (TIERS I -> IV)
      // Clean, uncrowded layout with subtle tier labels
      // ─────────────────────────────────────────────────────────────
      for (const m of modes) {
        updateStatus(`Rendering ${m.name} Evolution Lineup (Tiers I - IV)...`);
        drawCosmicBackground(m.theme);

        // Header Title - Clean, elegant, no fake archive spec codes
        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = 'bold 42px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
        ctx.fillStyle = m.color;
        ctx.letterSpacing = '4px';
        ctx.fillText(`${m.name.toUpperCase()} · EVOLUTION MATRIX`, 1920, 160);
        ctx.restore();

        // 4 Columns: Tier 1, Tier 2, Tier 3, Tier 4
        const colX = [540, 1420, 2380, 3300];
        const colU = [1.75, 1.55, 1.40, 1.25];
        const colY = 1100;

        for (let t = 1; t <= 4; t++) {
          window.CoreKinematics.continuousTier = t * 1.0;
          window.CoreKinematics.bodyBank = 0.0;
          window.CoreKinematics.vx = 0.0;
          window.CoreKinematics.overdriveFlash = (t === 4) ? 0.3 : 0.0;
          window.CoreKinematics.ascensionRings = (t === 4) ? [
            { radius: 120, alpha: 0.8, mode: m.id, tierReached: 4 }
          ] : [];

          m.render(colX[t - 1], colY, t, colU[t - 1]);

          // Column Caption
          ctx.save();
          ctx.textAlign = 'center';
          ctx.font = 'bold 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
          ctx.fillStyle = '#ffffff';
          const tLabels = ['TIER I', 'TIER II', 'TIER III', 'TIER IV'];
          ctx.fillText(tLabels[t - 1], colX[t - 1], 1750);
          ctx.restore();
        }

        await saveFrame(`Chrome_${m.titleName}_Evolution_Tiers_I_to_IV_4K.png`);
      }

      // ─────────────────────────────────────────────────────────────
      // TASK C: MASTER 12-MODEL MATRIX (3x4)
      // ─────────────────────────────────────────────────────────────
      updateStatus('Rendering Master 12-Model Matrix in 4K...');
      drawCosmicBackground('all');

      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = 'bold 44px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.letterSpacing = '4px';
      ctx.fillText('CHROME SYNAPSE · MASTER CHARACTER MATRIX', 1920, 140);
      ctx.restore();

      const matX = [680, 1500, 2360, 3220];
      const matY = [540, 1140, 1740];
      const matU = 1.05;

      for (let r = 0; r < 3; r++) {
        const m = modes[r];
        // Row label on the left
        ctx.save();
        ctx.textAlign = 'left';
        ctx.font = 'bold 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
        ctx.fillStyle = m.color;
        ctx.fillText(m.name.toUpperCase(), 80, matY[r] + 10);
        ctx.restore();

        for (let c = 0; c < 4; c++) {
          const t = c + 1;
          window.CoreKinematics.continuousTier = t * 1.0;
          window.CoreKinematics.bodyBank = 0.0;
          window.CoreKinematics.vx = 0.0;
          window.CoreKinematics.overdriveFlash = (t === 4) ? 0.25 : 0.0;
          window.CoreKinematics.ascensionRings = [];

          m.render(matX[c], matY[r], t, matU);
        }
      }

      // Column Header Labels at top
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = 'bold 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
      ctx.letterSpacing = '2px';
      const colLabels = ['TIER I', 'TIER II', 'TIER III', 'TIER IV'];
      for (let c = 0; c < 4; c++) {
        ctx.fillText(colLabels[c], matX[c], 260);
      }
      ctx.restore();

      await saveFrame('Chrome_All_Cores_12_Model_Master_Matrix_4K.png');

      // ─────────────────────────────────────────────────────────────
      // TASK D: AUTHENTIC FALLING COLLECTIBLE NODES
      // EXACT 1:1 REPLICATION OF IN-GAME SCREENSHOTS (Images 1, 2, 8, 9, 10)
      // ZERO BADGES, ZERO FAKE HUD TEXT
      // ─────────────────────────────────────────────────────────────

      // 1. Dynamo Collectible Orb (Matching Images 2 and 10 exactly!)
      updateStatus('Rendering Chrome Dynamo Collectible Orb 4K...');
      drawCosmicBackground('dynamo');

      const pDynamo = {
        x: 1920,
        y: 1180,
        headR: 260,
        animPhase: 0.5
      };

      // Exact in-game upward vertical cyan speedlines (Images 2 and 10)
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const speedlineOffsets = [-60, 0, 65];
      const speedlineLengths = [180, 240, 190];
      for (let s = 0; s < speedlineOffsets.length; s++) {
        const sx = pDynamo.x + speedlineOffsets[s];
        const bottomY = pDynamo.y - pDynamo.headR * 1.05;
        const topY = bottomY - speedlineLengths[s];
        const sGrad = ctx.createLinearGradient(0, topY, 0, bottomY);
        sGrad.addColorStop(0.0, 'rgba(56, 189, 248, 0)');
        sGrad.addColorStop(0.5, 'rgba(56, 189, 248, 0.45)');
        sGrad.addColorStop(1.0, 'rgba(186, 230, 253, 0.85)');
        ctx.fillStyle = sGrad;
        ctx.fillRect(sx - 3, topY, 6, speedlineLengths[s]);
      }
      ctx.restore();

      // Render the raw in-game Dynamo node (orb, lightning, smile arc, ring, twin motes)
      window.QuantumRenderer._drawLayeredNodeOrHazard(ctx, 'dynamo', pDynamo, now, pDynamo.headR);
      await saveFrame('Chrome_Dynamo_Collectible_Orb_4K.png');

      // 2. Helix Collectible Node (Matching Image 8 exactly!)
      updateStatus('Rendering Chrome Helix Collectible Node 4K...');
      drawCosmicBackground('helix');

      const pHelix = {
        x: 1920,
        y: 1180,
        headR: 260,
        animPhase: 0.5
      };

      // Exact in-game floating circular cyan bubble trail (Image 8)
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const bubbleDefs = [
        { dy: 30,  dx: -8,  r: 22, op: 0.85 },
        { dy: 75,  dx: 12,  r: 16, op: 0.75 },
        { dy: 120, dx: -18, r: 24, op: 0.80 },
        { dy: 170, dx: 10,  r: 14, op: 0.65 },
        { dy: 220, dx: -12, r: 20, op: 0.70 },
        { dy: 275, dx: 15,  r: 12, op: 0.55 },
        { dy: 330, dx: -6,  r: 18, op: 0.50 },
        { dy: 390, dx: 8,   r: 10, op: 0.40 },
        { dy: 440, dx: -14, r: 14, op: 0.35 }
      ];
      for (const b of bubbleDefs) {
        const bx = pHelix.x + b.dx;
        const by = pHelix.y - pHelix.headR - b.dy;
        const bGrad = ctx.createRadialGradient(bx - b.r * 0.3, by - b.r * 0.3, 1, bx, by, b.r);
        bGrad.addColorStop(0.0, `rgba(255, 255, 255, ${b.op * 0.9})`);
        bGrad.addColorStop(0.35, `rgba(186, 230, 253, ${b.op * 0.8})`);
        bGrad.addColorStop(0.75, `rgba(56, 189, 248, ${b.op * 0.55})`);
        bGrad.addColorStop(1.0, `rgba(56, 189, 248, 0)`);
        ctx.fillStyle = bGrad;
        ctx.beginPath();
        ctx.arc(bx, by, b.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // Render raw in-game Helix node (crystal bubble with 3D DNA double helix)
      window.QuantumRenderer._drawLayeredNodeOrHazard(ctx, 'helix', pHelix, now, pHelix.headR);
      await saveFrame('Chrome_Helix_Collectible_Node_4K.png');

      // 3. Meteor Collectible Node (Matching Image 9 exactly!)
      updateStatus('Rendering Chrome Meteor Collectible Node 4K...');
      drawCosmicBackground('meteor');

      const pMeteor = {
        x: 1920,
        y: 1180,
        headR: 260,
        animPhase: 0.5,
        tumbleDir: 1
      };

      // Exact in-game floating circular orange ember trail (Image 9)
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const emberDefs = [
        { dy: 35,  dx: 10,  r: 22, op: 0.85 },
        { dy: 80,  dx: -14, r: 16, op: 0.75 },
        { dy: 130, dx: 16,  r: 24, op: 0.80 },
        { dy: 180, dx: -10, r: 14, op: 0.65 },
        { dy: 235, dx: 14,  r: 20, op: 0.70 },
        { dy: 290, dx: -12, r: 12, op: 0.55 },
        { dy: 345, dx: 8,   r: 18, op: 0.50 },
        { dy: 400, dx: -15, r: 10, op: 0.40 },
        { dy: 450, dx: 12,  r: 14, op: 0.35 }
      ];
      for (const e of emberDefs) {
        const ex = pMeteor.x + e.dx;
        const ey = pMeteor.y - pMeteor.headR - e.dy;
        const eGrad = ctx.createRadialGradient(ex - e.r * 0.3, ey - e.r * 0.3, 1, ex, ey, e.r);
        eGrad.addColorStop(0.0, `rgba(254, 240, 138, ${e.op * 0.95})`);
        eGrad.addColorStop(0.35, `rgba(249, 115, 22, ${e.op * 0.85})`);
        eGrad.addColorStop(0.75, `rgba(220, 38, 38, ${e.op * 0.55})`);
        eGrad.addColorStop(1.0, `rgba(220, 38, 38, 0)`);
        ctx.fillStyle = eGrad;
        ctx.beginPath();
        ctx.arc(ex, ey, e.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // Render raw in-game Meteor node (volcanic basalt rock with magma fissures)
      window.QuantumRenderer._drawLayeredNodeOrHazard(ctx, 'meteor', pMeteor, now, pMeteor.headR);
      await saveFrame('Chrome_Meteor_Collectible_Node_4K.png');

      // 4. Showcase of all 3 collectible nodes side-by-side
      updateStatus('Rendering All Falling Nodes Showcase 4K...');
      drawCosmicBackground('all');

      const nodeX = [780, 1920, 3060];
      const nodeY = 1180;
      const nodeR = 210;

      // Dynamo Node with speedlines
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let s = 0; s < speedlineOffsets.length; s++) {
        const sx = nodeX[0] + speedlineOffsets[s] * 0.8;
        const bottomY = nodeY - nodeR * 1.05;
        const topY = bottomY - speedlineLengths[s] * 0.8;
        const sGrad = ctx.createLinearGradient(0, topY, 0, bottomY);
        sGrad.addColorStop(0.0, 'rgba(56, 189, 248, 0)');
        sGrad.addColorStop(0.5, 'rgba(56, 189, 248, 0.45)');
        sGrad.addColorStop(1.0, 'rgba(186, 230, 253, 0.85)');
        ctx.fillStyle = sGrad;
        ctx.fillRect(sx - 2.5, topY, 5, speedlineLengths[s] * 0.8);
      }
      ctx.restore();
      window.QuantumRenderer._drawLayeredNodeOrHazard(ctx, 'dynamo', { x: nodeX[0], y: nodeY, headR: nodeR, animPhase: 0.5 }, now, nodeR);

      // Helix Node with bubble trail
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (const b of bubbleDefs) {
        const bx = nodeX[1] + b.dx * 0.8;
        const by = nodeY - nodeR - b.dy * 0.8;
        const br = b.r * 0.8;
        const bGrad = ctx.createRadialGradient(bx - br * 0.3, by - br * 0.3, 1, bx, by, br);
        bGrad.addColorStop(0.0, `rgba(255, 255, 255, ${b.op * 0.9})`);
        bGrad.addColorStop(0.35, `rgba(186, 230, 253, ${b.op * 0.8})`);
        bGrad.addColorStop(0.75, `rgba(56, 189, 248, ${b.op * 0.55})`);
        bGrad.addColorStop(1.0, `rgba(56, 189, 248, 0)`);
        ctx.fillStyle = bGrad;
        ctx.beginPath();
        ctx.arc(bx, by, br, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
      window.QuantumRenderer._drawLayeredNodeOrHazard(ctx, 'helix', { x: nodeX[1], y: nodeY, headR: nodeR, animPhase: 0.5 }, now, nodeR);

      // Meteor Node with ember trail
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (const e of emberDefs) {
        const ex = nodeX[2] + e.dx * 0.8;
        const ey = nodeY - nodeR - e.dy * 0.8;
        const er = e.r * 0.8;
        const eGrad = ctx.createRadialGradient(ex - er * 0.3, ey - er * 0.3, 1, ex, ey, er);
        eGrad.addColorStop(0.0, `rgba(254, 240, 138, ${e.op * 0.95})`);
        eGrad.addColorStop(0.35, `rgba(249, 115, 22, ${e.op * 0.85})`);
        eGrad.addColorStop(0.75, `rgba(220, 38, 38, ${e.op * 0.55})`);
        eGrad.addColorStop(1.0, `rgba(220, 38, 38, 0)`);
        ctx.fillStyle = eGrad;
        ctx.beginPath();
        ctx.arc(ex, ey, er, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
      window.QuantumRenderer._drawLayeredNodeOrHazard(ctx, 'meteor', { x: nodeX[2], y: nodeY, headR: nodeR, animPhase: 0.5, tumbleDir: 1 }, now, nodeR);

      // Subtle labels below each node
      const nodeLabels = [
        { title: 'CHROME DYNAMO', col: '#c084fc' },
        { title: 'CHROME HELIX', col: '#38bdf8' },
        { title: 'CHROME METEOR', col: '#f97316' }
      ];

      for (let i = 0; i < 3; i++) {
        ctx.save();
        ctx.textAlign = 'center';
        ctx.font = 'bold 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
        ctx.fillStyle = nodeLabels[i].col;
        ctx.letterSpacing = '3px';
        ctx.fillText(nodeLabels[i].title, nodeX[i], 1680);
        ctx.restore();
      }

      await saveFrame('Chrome_All_Falling_Nodes_Showcase_4K.png');

      // ─────────────────────────────────────────────────────────────
      // TASK E: 3 HAZARDS (BROKEN ARC, FACET DUST, ASH FLAKES)
      // ─────────────────────────────────────────────────────────────
      // 1. Broken Arc (Dynamo Hazard)
      updateStatus('Rendering Broken Arc Hazard 4K...');
      drawCosmicBackground('hazard_dynamo');
      const hDynamo = {
        x: 1920,
        y: 1080,
        headR: 240,
        nodeClass: 'volatile',
        animPhase: 0.5
      };
      window.QuantumRenderer._drawLayeredNodeOrHazard(ctx, 'dynamo', hDynamo, now, 240);
      await saveFrame('Chrome_Dynamo_Hazard_Broken_Arc_4K.png');

      // 2. Facet Dust (Helix Hazard)
      updateStatus('Rendering Facet Dust Hazard 4K...');
      drawCosmicBackground('hazard_helix');
      const hHelix = {
        x: 1920,
        y: 1080,
        headR: 240,
        nodeClass: 'volatile',
        animPhase: 0.5
      };
      window.QuantumRenderer._drawLayeredNodeOrHazard(ctx, 'helix', hHelix, now, 240);
      await saveFrame('Chrome_Helix_Hazard_Facet_Dust_4K.png');

      // 3. Ash Flakes (Meteor Hazard)
      updateStatus('Rendering Ash Flakes Hazard 4K...');
      drawCosmicBackground('hazard_meteor');
      const hMeteor = {
        x: 1920,
        y: 1080,
        headR: 240,
        nodeClass: 'volatile',
        animPhase: 0.5
      };
      window.QuantumRenderer._drawLayeredNodeOrHazard(ctx, 'meteor', hMeteor, now, 240);
      await saveFrame('Chrome_Meteor_Hazard_Ash_Flakes_4K.png');

      // ─────────────────────────────────────────────────────────────
      // TASK F: MASTER ROSTER PANORAMA (ALL SOVEREIGN OVERDRIVE CORES)
      // ─────────────────────────────────────────────────────────────
      updateStatus('Rendering Master Roster Panorama in 4K...');
      drawCosmicBackground('all');

      // Render the three Sovereign Overdrive Tier IV Cores with full wings & zero clipping
      // Left: Chrome Helix
      window.CoreKinematics.continuousTier = 4.0;
      window.CoreKinematics.bodyBank = -0.06;
      window.CoreKinematics.vx = 0.0;
      window.CoreKinematics.overdriveFlash = 0.25;
      window.CoreKinematics.ascensionRings = [{ radius: 130, alpha: 0.7, mode: 'helix', tierReached: 4 }];
      window.QuantumRenderer.drawHelixCore(ctx, 920, 1080, now, 0, 4, 1.30);

      // Center: Chrome Dynamo
      window.CoreKinematics.continuousTier = 4.0;
      window.CoreKinematics.bodyBank = 0.0;
      window.CoreKinematics.vx = 0.0;
      window.CoreKinematics.overdriveFlash = 0.40;
      window.CoreKinematics.ascensionRings = [
        { radius: 140, alpha: 0.85, mode: 'dynamo', tierReached: 4 },
        { radius: 210, alpha: 0.55, mode: 'dynamo', tierReached: 4 }
      ];
      window.QuantumRenderer.drawDynamoCore(ctx, 1920, 1030, now, 0, 4, 1.55);

      // Right: Chrome Meteor
      window.CoreKinematics.continuousTier = 4.0;
      window.CoreKinematics.bodyBank = 0.06;
      window.CoreKinematics.vx = 0.0;
      window.CoreKinematics.overdriveFlash = 0.25;
      window.CoreKinematics.ascensionRings = [{ radius: 130, alpha: 0.7, mode: 'meteor', tierReached: 4 }];
      window.QuantumRenderer.drawMeteorAsteroid(ctx, 2920, 1080, now, 0, 4, 1.30);

      // Labels below each Core
      ctx.save();
      ctx.textAlign = 'center';
      // Helix
      ctx.font = 'bold 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      ctx.fillStyle = '#38bdf8';
      ctx.letterSpacing = '3px';
      ctx.fillText('CHROME HELIX', 920, 1680);

      // Dynamo
      ctx.font = 'bold 36px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      ctx.fillStyle = '#c084fc';
      ctx.letterSpacing = '3px';
      ctx.fillText('CHROME DYNAMO', 1920, 1680);

      // Meteor
      ctx.font = 'bold 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      ctx.fillStyle = '#f97316';
      ctx.letterSpacing = '3px';
      ctx.fillText('CHROME METEOR', 2920, 1680);
      ctx.restore();

      await saveFrame('Chrome_Arcade_All_Characters_4K.png');

      // Notify completion
      updateStatus('ALL 24 4K PICTURES SUCCESSFULLY RENDERED & SAVED TO DOWNLOADS!');
      await fetch('/done', { method: 'POST' });
    })();
  </script>
