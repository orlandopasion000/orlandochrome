<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title id="pageTitle">OrlandoChrome (Main Version)</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=pure121">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v=pure121">
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=pure121">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=pure121">

  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="OrlandoChrome (Main Version)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="OrlandoChrome · Taskbar Chrome Profile Messenger, AI Cooldown Timers & Wispr Flow Pro Dictation Suite.">
  <link rel="manifest" id="manifestLink" href="manifest.json?v=pure121">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=pure121">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180x180.png?v=pure121">
  <link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon-167x167.png?v=pure121">
  <link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152x152.png?v=pure121">
  <link rel="apple-touch-icon" sizes="120x120" href="apple-touch-icon-120x120.png?v=pure121">
  <link rel="stylesheet" href="styles.css?v=pure121">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&family=Lexend:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="netflix-messenger-theme">
  <!-- Top Application Bar -->
  <header class="app-topbar">
    <div class="topbar-left">
      <div class="brand-logo" id="logoBtn" title="OrlandoChrome (Main Version)">
        <img src="oc-logo.png" class="oc-logo-img" alt="OrlandoChrome Logo" onerror="this.onerror=null;this.src='oc-logo.svg'">
        <div class="brand-text-wrap">
          <span class="brand-title"><span class="title-orlando">ORLANDO</span><span class="title-chrome">CHROME</span></span>
        </div>
      </div>
    </div>

    <div class="topbar-right">
      <!-- Jump to Next Ready Profile (Alt+N) -->
            <!-- Real-Time Cross-Device Sync Pill (Desktop & iPhone) -->
      <button type="button" class="btn-topbar-quick btn-topbar-sync" id="btnTopbarSyncNow" title="Tap to sync instantly between Laptop & iPhone">
        <svg class="modern-icon" viewBox="0 0 24 24" fill="none" width="13" height="13">
          <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3L21.5 8M22 12.5a10 10 0 0 1-18.8 4.2L2.5 16" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span id="topbarSyncQuickLabel">Sync</span>
      </button>

      <button type="button" class="btn-topbar-quick" id="btnNextReady" title="Jump to next profile with Pending Note or Limit Reset (Alt + N)">
        <svg class="modern-icon modern-icon-gold" viewBox="0 0 24 24" fill="none"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="rgba(245,158,11,0.25)"/><circle cx="12" cy="12" r="1.5" fill="#ffffff"/></svg> <span>Next Ready</span>
      </button>

      <!-- Voice Commands & Instructions Manual Button (Always Visible) -->
      <button type="button" class="btn-topbar-quick btn-topbar-voice-btn" id="btnTopbarVoiceManual" title="Voice Commands Manual & Hands-Free Instructions (Alt + V)">
        <span style="font-size:12px;">🎙️</span> <span>Voice Commands</span>
      </button>

      <!-- Compressed Single "System" Command Button & Floating Futuristic Dropdown -->
      <div class="system-menu-wrapper" id="systemMenuWrapper">
        <button type="button" class="btn-topbar-system" id="btnSystemMenu" aria-haspopup="true" aria-expanded="false" title="System Menu (Recovery, Centennial Recovery, Open main web app, Holographic QR)">
          <svg class="modern-icon modern-icon-cyan" viewBox="0 0 24 24" fill="none" style="width:13px;height:13px;"><circle cx="12" cy="12" r="3" stroke="#38bdf8" stroke-width="2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" stroke="#38bdf8" stroke-width="1.8"/></svg>
          <span class="system-btn-text">System</span>
          <span class="sync-status-dot synced" id="topbarSyncDot" title="Cloud Synchronized"></span>
          <svg class="system-caret" viewBox="0 0 24 24" width="9" height="9" fill="none"><path d="M6 9l6 6 6-6" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round"/></svg>
        </button>

        <!-- Floating Dropdown Menu -->
        <div class="system-dropdown-menu" id="systemDropdownMenu" role="menu" aria-label="System Menu">
          <!-- 1. Recovery (renamed from Recovery Vault) -->
          <button type="button" class="system-menu-item" id="btnOpenVault" role="menuitem" title="Recovery: Enterprise Data Recovery Vault & Rollback Checkpoints">
            <div class="menu-item-icon menu-icon-emerald">
              <svg class="modern-icon modern-icon-emerald" viewBox="0 0 24 24" fill="none"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke="#10b981" stroke-width="1.8" fill="rgba(16,185,129,0.2)"/><path d="M9 12l2 2 4-4" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <div class="menu-item-text">
              <div class="menu-item-title">Recovery</div>
              <div class="menu-item-desc">Multi-tier vault & rollback checkpoints</div>
            </div>
          </button>

          <!-- 2. Centennial Recovery (renamed from v100 Centennial) -->
          <button type="button" class="system-menu-item" id="btnOpenCentennial" role="menuitem" title="Centennial Recovery: Merkle Cryptographic Integrity & Forensic Console">
            <div class="menu-item-icon menu-icon-cyan">
              <svg class="modern-icon modern-icon-cyan" viewBox="0 0 24 24" fill="none"><polygon points="12 2 21 8.5 17 21 7 21 3 8.5 12 2" stroke="#38bdf8" stroke-width="1.8" fill="rgba(56,189,248,0.2)"/><polyline points="3 8.5 12 12.5 21 8.5" stroke="#38bdf8" stroke-width="1.8"/><line x1="12" y1="12.5" x2="12" y2="21" stroke="#38bdf8" stroke-width="1.8"/><line x1="12" y1="2" x2="12" y2="12.5" stroke="#38bdf8" stroke-width="1.8"/></svg>
            </div>
            <div class="menu-item-text">
              <div class="menu-item-title">Centennial Recovery</div>
              <div class="menu-item-desc">Merkle cryptographic integrity & self-heal</div>
            </div>
          </button>

          <!-- 3. Open main web app -->
          <button type="button" class="system-menu-item" id="btnTopbarLaunchApp" role="menuitem" title="Open main web app: Standalone Window">
            <div class="menu-item-icon menu-icon-red">
              <span class="desktop-btn-icon" id="topbarLaunchIcon"><svg class="modern-icon" viewBox="0 0 24 24" fill="none"><polygon points="12 2 21 7 21 17 12 22 3 17 3 7" stroke="#ff4d58" stroke-width="1.8" fill="rgba(229,9,20,0.2)" stroke-linejoin="round"/><polyline points="7 12 12 7 17 12" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="7" x2="12" y2="17" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/></svg></span>
            </div>
            <div class="menu-item-text">
              <div class="menu-item-title" id="topbarLaunchLabel">Open main web app</div>
              <div class="menu-item-desc">Launch standalone desktop window</div>
            </div>
          </button>

          <!-- 4. Holographic QR (renamed from App Suite) -->
          <button type="button" class="system-menu-item" id="btnOpenAppSuite" role="menuitem" title="Holographic QR: Live Phone Scanner & Cross-Device Cloud Sync Suite">
            <div class="menu-item-icon menu-icon-blue">
              <svg class="modern-icon modern-icon-blue" viewBox="0 0 24 24" fill="none"><polygon points="12 2 22 7.5 22 16.5 12 22 2 16.5 2 7.5" stroke="#60a5fa" stroke-width="1.8" fill="rgba(96,165,250,0.2)" stroke-linejoin="round"/><line x1="12" y1="22" x2="12" y2="12" stroke="#60a5fa" stroke-width="1.6"/><line x1="22" y1="7.5" x2="12" y2="12" stroke="#60a5fa" stroke-width="1.6"/><line x1="2" y1="7.5" x2="12" y2="12" stroke="#60a5fa" stroke-width="1.6"/><circle cx="12" cy="12" r="2" fill="#ffffff"/></svg>
            </div>
            <div class="menu-item-text">
              <div class="menu-item-title-row">
                <span class="menu-item-title">Holographic QR</span>
                <span class="pwa-ready-mini-badge" style="font-size:10px;padding:2px 6px;border-radius:4px;background:rgba(16,185,129,0.15);color:#34d399;font-weight:700;"><span id="topbarSyncLabel">Synced</span></span>
              </div>
              <div class="menu-item-desc">Live phone scanner & cloud sync bridge</div>
            </div>
          </button>

          <!-- 5. Trash (Recently Deleted Vault) -->
          <button type="button" class="system-menu-item" id="btnSystemTrash" role="menuitem" title="Trash: 30-Day Recently Deleted Vault & Restoration">
            <div class="menu-item-icon menu-icon-orange">
              <svg class="modern-icon" viewBox="0 0 24 24" fill="none" style="width:14px;height:14px;"><polyline points="3 6 5 6 21 6" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/><line x1="10" y1="11" x2="10" y2="17" stroke="#fb923c" stroke-width="1.8"/><line x1="14" y1="11" x2="14" y2="17" stroke="#fb923c" stroke-width="1.8"/></svg>
            </div>
            <div class="menu-item-text">
              <div class="menu-item-title-row">
                <span class="menu-item-title">Trash</span>
                <span class="system-trash-badge" id="systemTrashCount" style="font-size:10px;padding:2px 6px;border-radius:4px;background:rgba(251,146,60,0.18);color:#fb923c;font-weight:700;">0 items</span>
              </div>
              <div class="menu-item-desc">30-day soft-delete safety vault</div>
            </div>
          </button>

          <!-- 7. Backup & Restore Workspace -->
          <button type="button" class="system-menu-item" id="btnSystemBackup" role="menuitem" title="Backup & Restore: Export or restore encrypted workspace JSON">
            <div class="menu-item-icon menu-icon-emerald">
              <svg class="modern-icon" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" style="width:14px;height:14px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </div>
            <div class="menu-item-text">
              <div class="menu-item-title">Backup &amp; Restore</div>
              <div class="menu-item-desc">Export or import JSON workspace backup</div>
            </div>
          </button>

          <!-- 8. OrlandoChrome (Blank Canvas) -->
          <button type="button" class="system-menu-item" id="btnSystemBlankCanvas" role="menuitem" title="OrlandoChrome (Blank Canvas): Clean pristine workspace">
            <div class="menu-item-icon menu-icon-purple" style="background:rgba(168,85,247,0.15);border:1px solid rgba(168,85,247,0.4);">
              <svg class="modern-icon" viewBox="0 0 24 24" fill="none" stroke="#c084fc" stroke-width="2" style="width:14px;height:14px;"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
            </div>
            <div class="menu-item-text">
              <div class="menu-item-title">OrlandoChrome (Blank Canvas)</div>
              <div class="menu-item-desc">Pristine workspace · Auto-scan laptop</div>
            </div>
          </button>

          <!-- 6. Voice Commands Manual & Hands-Free Instructions -->
          <button type="button" class="system-menu-item" id="btnSystemVoiceManual" role="menuitem" title="Voice Commands: 10 Superpowers & Hands-Free Instructions Manual">
            <div class="menu-item-icon" style="background:rgba(255,82,99,0.15);border:1px solid rgba(255,82,99,0.3);">
              <span style="font-size:14px;">🎙️</span>
            </div>
            <div class="menu-item-text">
              <div class="menu-item-title-row">
                <span class="menu-item-title">Voice Commands</span>
                <span style="font-size:10px;padding:2px 6px;border-radius:4px;background:rgba(255,82,99,0.18);color:#ff8591;font-weight:700;">10 Active</span>
              </div>
              <div class="menu-item-desc">10 Superpowers & hands-free instructions</div>
            </div>
          </button>
          </div>
      </div>

      <!-- Live Clock & Daily Recharge Alarm Widget -->
      <div class="nav-clock-box" id="navClockBox">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </header>

  <!-- Main 2-Pane Messenger Workspace -->
  <div class="app-workspace" id="appWorkspace">
    <!-- Left Column: Search, Filters, and Chrome Profiles -->
    <aside class="sidebar" id="appSidebar">
      <div class="sidebar-header">
        <div class="search-box-wrap">
          <span class="search-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#38bdf8" stroke-width="1.8"/><line x1="16.5" y1="16.5" x2="22" y2="22" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/><circle cx="11" cy="11" r="2" fill="rgba(56,189,248,0.5)"/></svg></span>
          <input type="text" id="profileSearch" class="search-input" placeholder="Search profiles or notes... (Alt+↑/↓)">
        </div>

        <div class="filter-tabs-row">
          <button class="filter-tab active" data-filter="all" id="tabAll">All (<span id="countAll">22</span>)</button>
          <button class="filter-tab" data-filter="unread" id="tabUnread"><span class="tab-blue-messenger-dot"></span> Unread (<span id="countUnread">0</span>)</button>
          <button class="filter-tab" data-filter="pending" id="tabPending"><span class="tab-red-radiant-dot"></span> Pending (<span id="countPending">0</span>)</button>
          <button class="filter-tab" data-filter="timers" id="tabTimers"><span class="tab-cyber-clock-wrap"><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#ffffff" stroke-width="1.8"/><path d="M12 7v5l3 2" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="1.5" fill="#ffffff"/></svg></span> Timers (<span id="countTimers">0</span>)</button>
        </div>
      </div>

      <!-- Profiles List -->
      <div class="profile-list" id="profileList">
        <!-- Rendered dynamically -->
      </div>
    </aside>

    <!-- Draggable Width Resizer Line Between Profiles & Messages -->
    <div class="workspace-resizer" id="workspaceResizer" title="Drag to adjust width · Double-click to reset">
      <span class="resizer-grip" aria-hidden="true"><svg class="resizer-grip-icon" viewBox="0 0 4 14" width="4" height="14" fill="currentColor"><circle cx="2" cy="2" r="1.2"/><circle cx="2" cy="7" r="1.2"/><circle cx="2" cy="12" r="1.2"/></svg></span>
    </div>

    <!-- Right Column: Active Chrome Profile Notes & Timers -->
    <main class="chat-main" id="chatMain">
      <!-- Rendered dynamically -->
    </main>
  </div>

  <!-- 8. APP DISTRIBUTION & COMMAND SUITE (Install, Share, QR, Backup, Blank Edition) -->
  
  <!-- Hidden Photo Upload Input (Profile Avatar) -->
  <input type="file" id="globalPhotoInput" accept="image/*" style="display:none;">
  <!-- Hidden Photo / Media Attachment Input (Chat Notes) -->
  <input type="file" id="noteImageInput" accept="image/*" style="display:none;">
  <input type="file" id="importNotesFileInput" accept=".json,.txt,.md" style="display:none;">
  <!-- Hidden JSON Backup Restore Input -->
  <input type="file" id="backupJsonInput" accept=".json,application/json" style="display:none;">
  <!-- Hidden Chrome Local State / Taskbar Scanner File Input (For Blank Edition Laptop Sync) -->
  <input type="file" id="localStateFileInput" style="display:none;">

  <!-- Toast Notification Container -->
  <div id="toast"></div>

  <!-- Scripts -->
  <script src="sound.js?v=pure121"></script>
  <script src="qrcode.min.js"></script>
  <script src="app.js?v=pure121"></script>

  <!-- BACKUP & RESTORE WORKSPACE MODAL -->
  <div class="modal-wrap" id="backupRestoreModal" role="dialog" aria-modal="true" aria-label="Backup & Restore Workspace" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:9999;align-items:center;justify-content:center;">
    <div class="modal-card" style="max-width:440px;width:90%;background:#0f1117;border:1px solid rgba(255,255,255,0.12);border-radius:14px;padding:22px;box-shadow:0 25px 60px rgba(0,0,0,0.85);color:#fff;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <h3 style="margin:0;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;color:#fff;">
          <span style="color:#10b981;">💾</span> Backup &amp; Restore Workspace
        </h3>
        <button type="button" id="btnCloseBackupRestoreModal" style="background:none;border:none;color:#94a3b8;font-size:20px;cursor:pointer;line-height:1;">✕</button>
      </div>
      <p style="font-size:12.5px;color:#94a3b8;line-height:1.5;margin-bottom:18px;">
        Export your entire 22-profile setup, timers, notes, and settings as an encrypted JSON file, or restore an existing backup.
      </p>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <button type="button" class="primary dist-btn" id="modalExportBackupBtn" style="padding:12px;font-weight:700;background:linear-gradient(135deg,#10b981,#059669);color:#fff;border-radius:8px;border:none;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span>Export Workspace Backup (.json)</span>
        </button>
        <button type="button" class="ghost dist-btn" id="modalImportBackupBtn" style="padding:12px;font-weight:600;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);border-radius:8px;display:flex;align-items:center;justify-content:center;gap:8px;color:#e2e8f0;cursor:pointer;">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span>Restore Workspace from File (.json)</span>
        </button>
        <input type="file" id="modalImportBackupFile" accept=".json,application/json" style="display:none">
      </div>
    </div>
  </div>
</body>
</html>
